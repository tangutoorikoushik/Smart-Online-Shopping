<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Online Shopping Website</title>
  <link rel="icon" href="./images/image.png">
  <link rel="stylesheet" href="./style.css">
  <script src="./index.js"></script>
</head>

<body>

  <!-- Header -->
  <header>
    <div class="logo">ShopEasy</div>

    <nav>
      <a href="#">Home</a>
      <a href="#">Products</a>
      <a href="#">Offers</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div>
      <h1>Online Shopping</h1>
      <p>Best Products at Best Prices</p>
      <button>Shop Now</button>
    </div>
  </section>

  <!-- Products -->
  <section class="products">
    <h2>Featured Products</h2>

    <div class="product-container">

      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=600&auto=format&fit=crop" alt="Shoes">

        <div class="product-info">
          <h3>Running Shoes</h3>
          <p class="price">$49</p>
          <button>Add to Cart</button>
        </div>
      </div>

      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=600&auto=format&fit=crop" alt="Watch">

        <div class="product-info">
          <h3>Smart Watch</h3>
          <p class="price">$99</p>
          <button>Add to Cart</button>
        </div>
      </div>

      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?q=80&w=600&auto=format&fit=crop" alt="Phone">

        <div class="product-info">
          <h3>Mobile Phone</h3>
          <p class="price">$399</p>
          <button>Add to Cart</button>
        </div>
      </div>

      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?q=80&w=600&auto=format&fit=crop" alt="T-shirt">

        <div class="product-info">
          <h3>Casual T-Shirt</h3>
          <p class="price">$25</p>
          <button>Add to Cart</button>
        </div>
      </div>

    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>© 2026 ShopEasy | All Rights Reserved</p>
  </footer>

</body>
</html>
